<html lang="es">
<head>

<title>Fiado — Cuaderno digital del tendero</title>
<meta name="description" content="El cuaderno de fiado del barrio, ahora digital con comandos de voz y WhatsApp. Funciona sin internet.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --paper:#FAF7F0;
  --paper-2:#F3EEE2;
  --ink:#1B2430;
  --ink-soft:#5A6472;
  --green:#0B5D3B;
  --green-deep:#083E28;
  --red:#C63A2A;
  --amber:#E8A33D;
  --line:#E3DDCF;
  --line-strong:#D6CEBB;
  --shadow:0 1px 0 rgba(27,36,48,.04), 0 8px 24px -12px rgba(27,36,48,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--paper);
  color:var(--ink);
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(100px + env(safe-area-inset-bottom));
}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;position:relative;background:var(--paper)}
.wrap::before{content:"";position:fixed;top:0;bottom:0;left:calc(50% - 260px + 26px);width:2px;background:var(--red);opacity:.55;z-index:0;pointer-events:none}
@media(max-width:520px){.wrap::before{left:26px}}

h1,h2,h3,.display{font-family:'Fraunces',Georgia,serif;font-weight:900;letter-spacing:-.02em;line-height:1.05;margin:0}
.money{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

header{position:sticky;top:0;z-index:20;background:var(--green);color:var(--paper);padding:14px 18px 14px 44px;display:flex;align-items:center;gap:12px}
header .brand{font-family:'Fraunces',serif;font-weight:900;font-size:22px}
header .tienda{font-size:12px;opacity:.85;margin-top:1px}
header .clock{margin-left:auto;text-align:right;font-size:11px;opacity:.9;line-height:1.25}
header .clock b{display:block;font-size:14px;font-variant-numeric:tabular-nums}
.gear{background:rgba(255,255,255,.14);border:0;color:var(--paper);width:40px;height:40px;border-radius:12px;font-size:19px;cursor:pointer;flex:0 0 auto}

main{padding:18px 18px 20px 44px;position:relative;z-index:1}
@media(max-width:520px){main{padding-left:44px}}

.hero{background:linear-gradient(160deg,#0D6B44,#083E28);color:var(--paper);border-radius:20px;padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero .lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.hero .big{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(40px,13vw,58px);margin-top:4px;line-height:1}
.hero .sub{font-size:13px;opacity:.85;margin-top:8px}
.hero .paidchip{position:absolute;top:18px;right:18px;background:rgba(255,255,255,.16);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:600}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat .n{font-family:'Fraunces',serif;font-weight:900;font-size:26px}
.stat .l{font-size:12px;color:var(--ink-soft);margin-top:2px}
.stat.red .n{color:var(--red)} .stat.green .n{color:var(--green)}

.searchbar{display:flex;gap:8px;margin:18px 0 8px}
.searchbar input{flex:1;border:1px solid var(--line-strong);background:var(--paper);border-radius:14px;padding:13px 14px;font-size:15px;font-family:inherit;color:var(--ink)}
.searchbar input:focus{outline:2px solid var(--green);outline-offset:1px}

/* Tarjeta informativa de voz */
.voice-banner{display:none;background:#FEF3C7;border:1px solid #F59E0B;border-radius:14px;padding:12px 14px;margin:12px 0;font-size:13px}
.voice-banner.recording{display:flex;align-items:center;gap:10px}
.voice-dot{width:10px;height:10px;background:#DC2626;border-radius:50%;animation:pulse-dot 1s infinite}
@keyframes pulse-dot{0%{transform:scale(0.8);opacity:0.6}50%{transform:scale(1.2);opacity:1}100%{transform:scale(0.8);opacity:0.6}}

.tabs-filtro{display:flex;gap:6px;margin:10px 0 6px}
.tab-btn{border:1px solid var(--line-strong);background:var(--paper-2);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--ink-soft);cursor:pointer}
.tab-btn.active{background:var(--green);color:#fff;border-color:var(--green)}

.sectionhead{display:flex;align-items:baseline;justify-content:space-between;margin:14px 0 8px}
.sectionhead h2{font-size:19px}
.sectionhead .link{background:none;border:0;color:var(--green);font-weight:600;font-size:13px;cursor:pointer;font-family:inherit}

.ledger{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);background:
  repeating-linear-gradient(transparent,transparent 30px,rgba(214,64,47,.03) 31px);
  cursor:pointer;width:100%;text-align:left;border-left:0;border-right:0;border-top:0;font-family:inherit}
.row:active{background:var(--paper-2)}
.avatar{width:44px;height:44px;border-radius:12px;background:var(--green);color:var(--paper);display:grid;place-items:center;font-family:'Fraunces',serif;font-weight:900;font-size:18px;flex:0 0 auto}
.row .who{flex:1;min-width:0}
.row .who .nm{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .who .meta{font-size:12px;color:var(--ink-soft);margin-top:2px}
.row .amt{text-align:right;flex:0 0 auto}
.row .amt .v{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.row .amt .v.debe{color:var(--red)} .row .amt .v.aldia{color:var(--green)}

.temp{height:5px;border-radius:999px;background:var(--line-strong);margin-top:6px;overflow:hidden;width:64px;margin-left:auto}
.temp span{display:block;height:100%}
.t-verde span{background:var(--green)} .t-ambar span{background:var(--amber)} .t-rojo span{background:var(--red)}

.empty{text-align:center;padding:46px 20px;color:var(--ink-soft)}
.empty .em{font-size:40px}
.empty h3{font-size:20px;color:var(--ink);margin:10px 0 4px}
.empty p{font-size:14px;margin:0 0 18px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:15px 18px;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;width:100%}
.btn-green{background:var(--green);color:var(--paper)}
.btn-green:active{background:var(--green-deep)}
.btn-wa{background:#1FA855;color:#fff}
.btn-ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line-strong)}
.btn-red{background:var(--red);color:#fff}
.btn-sm{padding:11px 14px;font-size:14px;width:auto}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btnrow.three{grid-template-columns:1fr 1fr 1fr}

/* Barra inferior unificada con Voz y Manual */
.dock-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(250,247,240,0.96);backdrop-filter:blur(8px);border-top:1px solid var(--line-strong);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:35}
.dock-inner{max-width:520px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.voice-tips{font-size:11px;color:var(--ink-soft);line-height:1.3;flex:1}
.voice-tips b{color:var(--ink);display:block}

.mic-btn-main{width:56px;height:56px;border-radius:50%;background:var(--red);color:#fff;border:none;box-shadow:0 6px 18px rgba(198,58,42,0.45);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform 0.1s}
.mic-btn-main:active{transform:scale(0.92)}
.mic-btn-main.pulse{animation:recording-pulse 1.3s infinite}
@keyframes recording-pulse{
  0%{box-shadow:0 0 0 0 rgba(198,58,42,0.7)}
  70%{box-shadow:0 0 0 16px rgba(198,58,42,0)}
  100%{box-shadow:0 0 0 0 rgba(198,58,42,0)}
}

.view{position:fixed;inset:0;background:var(--paper);z-index:40;overflow-y:auto;transform:translateY(100%);transition:transform .28s cubic-bezier(.4,0,.1,1);display:flex;flex-direction:column}
.view.open{transform:none}
.vhead{position:sticky;top:0;background:var(--green);color:var(--paper);padding:16px 18px;display:flex;align-items:center;gap:14px;z-index:2}
.vhead .x{background:rgba(255,255,255,.16);border:0;color:var(--paper);width:38px;height:38px;border-radius:11px;font-size:20px;cursor:pointer}
.vhead h2{font-size:19px}
.vbody{padding:20px 18px 40px;max-width:520px;margin:0 auto;width:100%}

label.f{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin:16px 0 6px}
input.f,textarea.f,select.f{width:100%;border:1px solid var(--line-strong);background:var(--paper);border-radius:13px;padding:14px;font-size:16px;font-family:inherit;color:var(--ink)}
input.f:focus,textarea.f:focus,select.f:focus{outline:2px solid var(--green);outline-offset:1px}
.moneyin{font-family:'Fraunces',serif;font-weight:900;font-size:34px;text-align:center;letter-spacing:-.02em;padding:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid var(--line-strong);background:var(--paper);border-radius:999px;padding:9px 14px;font-size:14px;cursor:pointer;font-family:inherit;color:var(--ink)}
.chip.on{background:var(--green);color:var(--paper);border-color:var(--green)}
.chip.q{background:var(--paper-2)}

.detail-saldo{text-align:center;padding:22px 0 6px}
.detail-saldo .lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.detail-saldo .v{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(38px,12vw,54px);margin-top:4px}
.detail-saldo .v.debe{color:var(--red)} .detail-saldo .v.aldia{color:var(--green)}
.phone-line{display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;color:var(--ink-soft);margin-top:4px}
.phone-line button{background:none;border:0;color:var(--green);font-weight:600;cursor:pointer;font-family:inherit;font-size:13px}

.mov{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line)}
.mov .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:16px;flex:0 0 auto}
.mov .ic.f{background:rgba(198,58,42,.12);color:var(--red)}
.mov .ic.a{background:rgba(11,93,59,.12);color:var(--green)}
.mov .d{flex:1;min-width:0}
.mov .d .t{font-weight:600;font-size:15px}
.mov .d .s{font-size:12px;color:var(--ink-soft)}
.mov .m{font-weight:700;font-variant-numeric:tabular-nums}
.mov .m.f{color:var(--red)} .mov .m.a{color:var(--green)}

.tag-fac{display:inline-block;font-size:11px;font-weight:600;padding:2px 6px;border-radius:6px;margin-left:4px;vertical-align:middle}
.tag-fac.fiado{background:#F3EEE2;color:var(--ink);border:1px solid var(--line-strong)}
.tag-fac.abono{background:#E8F5E9;color:var(--green);border:1px solid #C8E6C9}

.notice{background:var(--paper-2);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:12.5px;color:var(--ink-soft);line-height:1.55;margin-top:14px}
.notice b{color:var(--ink)}
.consent{display:flex;gap:12px;align-items:flex-start;margin-top:16px;padding:14px;border:1px solid var(--line-strong);border-radius:14px;background:var(--paper)}
.consent input{width:22px;height:22px;flex:0 0 auto;margin-top:2px;accent-color:var(--green)}
.consent span{font-size:13px;line-height:1.5}
.consent a{color:var(--green);font-weight:600}

.toast{position:fixed;bottom:calc(95px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:13px 20px;border-radius:12px;font-size:14px;font-weight:500;z-index:80;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}

.modal-bg{position:fixed;inset:0;background:rgba(27,36,48,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:.25s}
.modal-bg.open{opacity:1;pointer-events:auto}
.modal{background:var(--paper);border-radius:22px 22px 0 0;max-width:520px;width:100%;max-height:85vh;overflow-y:auto;padding:8px 20px 30px;transform:translateY(30px);transition:.28s}
.modal-bg.open .modal{transform:none}
.modal .grip{width:44px;height:5px;background:var(--line-strong);border-radius:999px;margin:8px auto 14px}
.modal h2{font-size:22px;margin-bottom:10px}
.modal p{font-size:14px;color:var(--ink-soft);line-height:1.6}
.modal h4{font-family:'Fraunces',serif;font-size:15px;margin:16px 0 4px}

footer.credit{text-align:center;padding:22px 18px;font-size:11px;color:var(--ink-soft);position:relative;z-index:1;border-top:1px solid var(--line);margin-top:10px}
footer.credit b{color:var(--green);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand">Fiado</div>
      <div class="tienda" id="hTienda">Mi tienda</div>
    </div>
    <button class="gear" id="btnGear" aria-label="Ajustes">⚙︎</button>
    <div class="clock" id="clock" aria-live="off"><b>--:--</b><span>Colombia</span></div>
  </header>

  <main id="main"><!-- render dinámico --></main>

  <!-- Barra Fija Inferior con Micrófono y Ayuda -->
  <div class="dock-bar">
    <div class="dock-inner">
      <div class="voice-tips">
        <b>🎤 Voz con Factura / Remisión:</b>
        "Fío a Carlos 90 mil factura 104"
      </div>
      <button class="btn btn-red btn-sm" onclick="abrirFiar()" style="width:auto;padding:12px 14px;">＋ Manual</button>
      <button id="micBtn" class="mic-btn-main" onclick="toggleVoiceRecognition()" title="Presiona para hablar">
        <svg width="26" height="26" fill="currentColor" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
      </button>
    </div>
  </div>

  <footer class="credit">
    Datos guardados solo en este dispositivo · Hora oficial de Colombia (UTC−5)<br>
    Desarrollada por <b>VIBRAS POSITIVAS HM</b> — Derechos de Autor Reservados
  </footer>
</div>

<div id="viewLayer"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============ Utilidades Colombia / Formato ============ */
const COP = n => new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(Math.round(n||0));
const NUM = n => new Intl.NumberFormat('es-CO',{maximumFractionDigits:0}).format(Math.round(n||0));
function nowCO(){
  const s = new Date().toLocaleString('en-US',{timeZone:'America/Bogota'});
  return new Date(s);
}
function isoCO(){ return nowCO().toISOString(); }
function fechaCO(iso){
  return new Date(iso).toLocaleDateString('es-CO',{timeZone:'America/Bogota',day:'2-digit',month:'short',year:'numeric'});
}
function diasDesde(iso){
  const a=nowCO(); a.setHours(0,0,0,0);
  const b=new Date(new Date(iso).toLocaleString('en-US',{timeZone:'America/Bogota'})); b.setHours(0,0,0,0);
  return Math.max(0,Math.round((a-b)/86400000));
}
function esHoyCO(iso){
  const d=new Date(iso).toLocaleDateString('en-CA',{timeZone:'America/Bogota'});
  const h=nowCO().toLocaleDateString('en-CA',{timeZone:'America/Bogota'});
  return d===h;
}
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const initials = nm => (nm||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();
const maskPhone = p => { p=(p||'').replace(/\D/g,''); return p? '••• ••• '+p.slice(-2) : 'Sin teléfono'; };

/* ============ IndexedDB ============ */
const DB_NAME='tendero_fiado', DB_VER=1;
let db;
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('clientes')) d.createObjectStore('clientes',{keyPath:'id'});
      if(!d.objectStoreNames.contains('movimientos')){const m=d.createObjectStore('movimientos',{keyPath:'id'});m.createIndex('cliente','clienteId',{unique:false});}
      if(!d.objectStoreNames.contains('config')) d.createObjectStore('config',{keyPath:'k'});
    };
    r.onsuccess=e=>{db=e.target.result;res(db);};
    r.onerror=e=>rej(e.target.error);
  });
}
function tx(store,mode='readonly'){return db.transaction(store,mode).objectStore(store);}
const put = (s,v)=>new Promise((res,rej)=>{const r=tx(s,'readwrite').put(v);r.onsuccess=()=>res(v);r.onerror=()=>rej(r.error);});
const del = (s,k)=>new Promise((res,rej)=>{const r=tx(s,'readwrite').delete(k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});
const getAll = s=>new Promise((res,rej)=>{const r=tx(s).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);});
const getOne = (s,k)=>new Promise((res,rej)=>{const r=tx(s).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const clearStore = s=>new Promise((res,rej)=>{const r=tx(s,'readwrite').clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});

/* ============ Estado en memoria ============ */
let CLIENTES=[], MOVS=[], CFG={k:'cfg',tienda:'Mi tienda',tendero:'',plantilla:'', verTodos:false, verTelefono:false};
let mostrarTodosFiltro = false;

async function cargarTodo(){
  CLIENTES = await getAll('clientes');
  MOVS = await getAll('movimientos');
  const c = await getOne('config','cfg');
  if(c) CFG = Object.assign(CFG,c);
  document.getElementById('hTienda').textContent = CFG.tienda||'Mi tienda';
}
async function guardarCfg(){ CFG.k='cfg'; await put('config',CFG); document.getElementById('hTienda').textContent=CFG.tienda||'Mi tienda'; }

function saldoDe(id){
  return MOVS.filter(m=>m.clienteId===id).reduce((s,m)=> s + (m.tipo==='fiado'? (+m.monto||0) : -(+m.monto||0)), 0);
}
function movsDe(id){ return MOVS.filter(m=>m.clienteId===id).sort((a,b)=> new Date(b.fecha)-new Date(a.fecha)); }
function deudaMasVieja(id){
  const fs = MOVS.filter(m=>m.clienteId===id && m.tipo==='fiado').sort((a,b)=> new Date(a.fecha)-new Date(b.fecha));
  return fs.length? diasDesde(fs[0].fecha) : 0;
}
function tempClase(dias){ return dias>30?'t-rojo':dias>=15?'t-ambar':'t-verde'; }
function tempPct(dias){ return Math.min(100, Math.max(14, Math.round(dias/45*100))); }

/* ============ Render Principal ============ */
const main=document.getElementById('main');
let filtro='';

function render(){
  const todosCalculados = CLIENTES.map(c=>({c,saldo:saldoDe(c.id),vieja:deudaMasVieja(c.id)}));
  const conSaldo = todosCalculados.filter(x=>x.saldo>0.5);
  const totalPorCobrar = conSaldo.reduce((s,x)=>s+x.saldo,0);
  const cobradoHoy = MOVS.filter(m=>m.tipo==='abono'&&esHoyCO(m.fecha)).reduce((s,m)=>(+m.monto||0)+s,0);
  const nDeudores = conSaldo.length;
  const alDia = CLIENTES.length - conSaldo.length;

  // Banner en vivo de voz
  const bannerVoz = `
    <div id="voiceBanner" class="voice-banner">
      <div class="voice-dot"></div>
      <div>
        <strong id="voiceStatusTitle" style="color:#92400E;display:block;">Escuchando...</strong>
        <span id="voiceTranscript" style="color:#1E293B;font-style:italic;">Diga: "Fío a Carlos 90 mil factura 104"</span>
      </div>
    </div>
  `;

  if(CLIENTES.length===0){
    main.innerHTML = `
      ${bannerVoz}

/* ============================================================
   MOTOR DE VOZ AVANZADO: MONTO + NOMBRE + NÚMERO DE FACTURA
   ============================================================ */
function wordsToNumber(text) {
  const lower = text.toLowerCase().replace(/[,.]/g, ' ').replace(/fío/g, 'fio').replace(/\$/g, '');
  const mixedMatch = lower.match(/(\d+)\s*(mil|k)/i);
  if (mixedMatch) return parseInt(mixedMatch[1], 10) * 1000;

  const units = {
    'un': 1, 'uno': 1, 'una': 1, 'dos': 2, 'tres': 3, 'cuatro': 4,
    'cinco': 5, 'seis': 6, 'siete': 7, 'ocho': 8, 'nueve': 9,
    'diez': 10, 'once': 11, 'doce': 12, 'trece': 13, 'catorce': 14,
    'quince': 15, 'dieciseis': 16, 'dieciséis': 16, 'diecisiete': 17,
    'dieciocho': 18, 'diecinueve': 19, 'veinte': 20, 'veintiuno': 21,
    'veintidos': 22, 'veintidós': 22, 'veintitres': 23, 'veintitrés': 23,
    'veinticuatro': 24, 'veinticinco': 25, 'veintiseis': 26, 'veintiséis': 26,
    'veintisiete': 27, 'veintiocho': 28, 'veintinueve': 29, 'treinta': 30,
    'cuarenta': 40, 'cincuenta': 50, 'sesenta': 60, 'setenta': 70,
    'ochenta': 80, 'noventa': 90, 'cien': 100, 'ciento': 100,
    'doscientos': 200, 'trescientos': 300, 'cuatrocientos': 400,
    'quinientos': 500, 'seiscientos': 600, 'setecientos': 700,
    'ochocientos': 800, 'novecientos': 900
  };

  const tokens = lower.split(/\s+/);
  let total = 0, current = 0, foundNumber = false;

  for (let i = 0; i < tokens.length; i++) {
    let token = tokens[i];
    if (/^\d+$/.test(token)) {
      current += parseInt(token, 10);
      foundNumber = true;
      continue;
    }
    if (units[token] !== undefined) {
      current += units[token];
      foundNumber = true;
    } else if (token === 'mil') {
      foundNumber = true;
      if (current === 0) current = 1;
      total += current * 1000;
      current = 0;
    } else if (token === 'millon' || token === 'millones') {
      foundNumber = true;
      if (current === 0) current = 1;
      total += current * 1000000;
      current = 0;
    }
  }
  total += current;
  return foundNumber ? total : null;
}

async function procesarComandoVoz(frase) {
  let raw = frase.toLowerCase().trim();

  // 1. Detección de Acción: Abono o Fiado
  const isAbono = /abono|abonó|abona|pago|pagó|dio|cancelo|canceló/i.test(raw);

  // 2. Extracción de Número de Factura o Remisión
  let factura = '';
  const facMatch = raw.match(/(?:factura|remision|remisión|cuenta|fac|rem)\s*(?:numero|número|no\.?|#)?\s*([a-zA-Z0-9\-]+)/i);
  if (facMatch) {
    factura = facMatch[1].toUpperCase();
    // Remover la sección de factura para no confundir con el monto
    raw = raw.replace(facMatch[0], ' ');
  }

  // 3. Extracción del Monto
  let amount = wordsToNumber(raw);
  if (!amount || amount < 100) {
    const digits = raw.match(/\b\d{3,7}\b/g);
    if (digits) amount = parseInt(digits[digits.length - 1], 10);
  }
  if (amount && amount < 1000 && (raw.includes('mil') || raw.includes('k') || amount <= 100)) {
    amount = amount * 1000;
  }

  if (!amount || amount <= 0) {
    alert(`Se escuchó: "${frase}", pero no se reconoció el valor en dinero.\n\nEjemplo: "Fío a Carlos 90 mil factura 104"`);
    return;
  }

  // 4. Extracción y Limpieza del Nombre del Cliente
  let cleaned = raw
    .replace(/^(fio|fío|tio|tío|fiar|apunte|apúntele|anote|anótele)\s+(a\s+)?/gi, '')
    .replace(/^(abono|abonó|abona|pago|pagó)\s+(a\s+)?/gi, '')
    .replace(/(\bme\s+(dio|pago|pagó)\b)/gi, '')
    .replace(/\b(a la|de la|con)\b/gi, '')
    .replace(/\b(pesos|mil|millones|dolares|cop)\b/gi, '')
    .replace(/\b(noventa|ochenta|setenta|sesenta|cincuenta|cuarenta|treinta|veinte|diez|quince|cien)\b/gi, '')
    .replace(/\b\d+\b/g, '')
    .replace(/\s+/g, ' ')
    .trim();

  let nombreCliente = cleaned.charAt(0).toUpperCase() + cleaned.slice(1);
  if (!nombreCliente || nombreCliente.length < 2) nombreCliente = "Cliente Mostrador";

  // 5. Vincular o Crear Cliente en IndexedDB
  let clienteExistente = CLIENTES.find(c => c.nombre.toLowerCase().trim() === nombreCliente.toLowerCase().trim());
  if (!clienteExistente) {
    // Si no coincide exacto, buscar si incluye parte del nombre
    clienteExistente = CLIENTES.find(c => c.nombre.toLowerCase().includes(nombreCliente.toLowerCase()));
  }

  let cid;
  if (!clienteExistente) {
    cid = uid();
    await put('clientes', {
      id: cid,
      nombre: nombreCliente,
      telefono: '',
      consentimiento: false,
      fechaConsentimiento: null,
      creado: isoCO()
    });
  } else {
    cid = clienteExistente.id;
    nombreCliente = clienteExistente.nombre;
  }

  // 6. Guardar Movimiento en Base de Datos
  await put('movimientos', {
    id: uid(),
    clienteId: cid,
    tipo: isAbono ? 'abono' : 'fiado',
    monto: amount,
    factura: factura,
    descripcion: isAbono ? 'Abono por voz' : 'Fiado por voz',
    fecha: isoCO(),
    creado: isoCO()
  });

  await cargarTodo();
  render();
  toast(`${isAbono ? 'Abono' : 'Fiado'} de ${COP(amount)} guardado a ${nombreCliente} ${factura ? '(Fact. #'+factura+')' : ''} ✔`);
}

/* ---- Web Speech API Controller ---- */
let recognition = null;
let isListening = false;

function toggleVoiceRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    alert("Tu navegador no soporta reconocimiento de voz. Usa el botón '＋ Manual'.");
    return;
  }

  const micBtn = document.getElementById('micBtn');
  const banner = document.getElementById('voiceBanner');
  const transcript = document.getElementById('voiceTranscript');
  const title = document.getElementById('voiceStatusTitle');

  if (isListening) {
    recognition.stop();
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = 'es-CO';
  recognition.continuous = false;
  recognition.interimResults = true;

  recognition.onstart = () => {
    isListening = true;
    micBtn.classList.add('pulse');
    if (banner) {
      banner.className = 'voice-banner recording';
      title.innerText = 'Escuchando... hable ahora';
      transcript.innerText = 'Diga ej: "Fío a Carlos 90 mil factura 104"';
    }
  };

  recognition.onresult = (e) => {
    const text = Array.from(e.results).map(r => r[0].transcript).join('');
    if (transcript) transcript.innerText = `"${text}"`;
  };

  recognition.onend = () => {
    isListening = false;
    micBtn.classList.remove('pulse');
    const finalSpoken = transcript ? transcript.innerText.replace(/"/g, '').trim() : '';
    if (banner) {
      setTimeout(() => { banner.className = 'voice-banner'; }, 2200);
    }
    if (finalSpoken && !finalSpoken.includes('Diga ej:')) {
      procesarComandoVoz(finalSpoken);
    }
  };

  recognition.onerror = (e) => {
    isListening = false;
    micBtn.classList.remove('pulse');
    if (banner) banner.className = 'voice-banner';
    console.error("Error en reconocimiento de voz:", e.error);
  };

  recognition.start();
}

/* ============================================================
   WHATSAPP & COMPROBANTES CON HISTORIAL DETALLADO
   ============================================================ */
function mensajeDefault(nombre, saldo, cId){
  const t = CFG.tienda || 'la tienda';
  const firma = CFG.tendero ? ('\n\n— ' + CFG.tendero) : '';
  const alDia = saldo <= 0.5;
  const ms = movsDe(cId).slice().reverse();
  let detalleTxt = '';

  if(ms.length > 0){
    detalleTxt = '\n\n*Detalle de movimientos:*';
    ms.forEach(m => {
      const fecha = fechaCO(m.fecha);
      if(m.tipo === 'fiado'){
        const fac = m.factura ? ` (Fact: #${m.factura})` : '';
        const desc = m.descripcion ? ` · ${m.descripcion}` : '';
        detalleTxt += `\n➕ ${fecha} Fiado: ${COP(m.monto)}${fac}${desc}`;
      } else {
        const fac = m.factura ? ` (A Fact: #${m.factura})` : '';
        detalleTxt += `\n➖ ${fecha} Abono: ${COP(m.monto)}${fac}`;
      }
    });
  }

  if(alDia){
    return `Hola ${nombre} 👋 Le escribo de *${t}*.\n\nLe confirmamos que su cuenta está *al día*. ¡Muchas gracias por su puntualidad y confianza! 🙌${detalleTxt}\n\n📌 *Saldo pendiente:* ${COP(0)}${firma}`;
  }
  return `Hola ${nombre} 👋 Le escribo de *${t}*.\n\nLe comparto el estado de su cuenta con nosotros:${detalleTxt}\n\n📌 *Saldo pendiente:* ${COP(saldo)}\n\nCuando pueda me colabora, ¡mil gracias! 🙏${firma}`;
}

function enviarWhatsAppCliente(c, saldo){
  let msg = (CFG.plantilla && CFG.plantilla.trim())
    ? CFG.plantilla.replaceAll('{nombre}', c.nombre).replaceAll('{monto}', COP(saldo)).replaceAll('{tienda}', CFG.tienda || 'la tienda')
    : mensajeDefault(c.nombre.split(' ')[0] ? ('Don/Doña ' + c.nombre.split(' ').slice(-1)[0]) : c.nombre, saldo, c.id);

  const el = openView(`
    <div class="vhead"><button class="x">‹</button><h2>Enviar comprobante</h2></div>
    <div class="vbody">
      <div class="notice">Revisa el comprobante antes de enviarlo por WhatsApp.</div>
      <label class="f">Mensaje</label>
      <textarea class="f" id="msg" rows="11">${esc(msg)}</textarea>
      ${c.telefono ? '' : '<div class="notice" style="border-color:var(--amber)">Este cliente no tiene teléfono guardado. Agrégalo en su perfil para enviar directo.</div>'}
      <div style="height:20px"></div>
      <button class="btn btn-wa" id="enviar">Abrir WhatsApp</button>
      <div style="height:10px"></div>
      <button class="btn btn-ghost" id="copiar">Copiar mensaje</button>
    </div>`);

  el.querySelector('.x').onclick = () => closeView(el);
  el.querySelector('#enviar').onclick = () => {
    const texto = encodeURIComponent(el.querySelector('#msg').value);
    let phone = (c.telefono || '').replace(/\D/g, '');
    if(phone && phone.length === 10) phone = '57' + phone;
    const url = phone ? `https://wa.me/${phone}?text=${texto}` : `https://wa.me/?text=${texto}`;
    window.open(url, '_blank');
  };
  el.querySelector('#copiar').onclick = async () => {
    try { 
      await navigator.clipboard.writeText(el.querySelector('#msg').value); 
      toast('Mensaje copiado ✔'); 
    } catch { 
      toast('Mantén presionado para copiar'); 
    }
  };
}

function resumenDatos(){
  const filas = CLIENTES.map(c=>{
    const ms = MOVS.filter(m=>m.clienteId===c.id);
    const fiado = ms.filter(m=>m.tipo==='fiado').reduce((s,m)=>s+(+m.monto||0),0);
    const abono = ms.filter(m=>m.tipo==='abono').reduce((s,m)=>s+(+m.monto||0),0);
    return { c, movs:ms.length, fiado, abono, saldo: fiado-abono, dias: deudaMasVieja(c.id) };
  }).sort((a,b)=> b.saldo-a.saldo || a.c.nombre.localeCompare(b.c.nombre));
  const totalFiado = filas.reduce((s,x)=>s+x.fiado,0);
  const totalAbono = filas.reduce((s,x)=>s+x.abono,0);
  const porCobrar  = filas.filter(x=>x.saldo>0.5).reduce((s,x)=>s+x.saldo,0);
  const deben = filas.filter(x=>x.saldo>0.5).length;
  return { filas, totalFiado, totalAbono, porCobrar, deben, alDia: filas.length-deben, nMovs: MOVS.length };
}

  const R = resumenDatos();

  `);
}

async function exportar(){
  const data={version:1,exportado:isoCO(),config:CFG,clientes:CLIENTES,movimientos:MOVS};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  await compartirODescargar(blob,'fiado-respaldo-'+nowCO().toLocaleDateString('en-CA',{timeZone:'America/Bogota'})+'.json','Respaldo Fiado');
}

function restaurarDesdeInput(inp){
  const f=inp.files&&inp.files[0];
  if(f) restaurarArchivo(f);
}

async function restaurarArchivo(file){
  try{
    const txt = await file.text();
    const data = JSON.parse(txt);
    if(!data || !Array.isArray(data.clientes) || !Array.isArray(data.movimientos)) throw new Error('formato');
    if(!confirm('Se van a restaurar '+data.clientes.length+' clientes y '+data.movimientos.length+' movimientos.\n\n¿Continuar?')) return;
    for(const c of data.clientes){ if(c && c.id) await put('clientes',c); }
    for(const m of data.movimientos){ if(m && m.id) await put('movimientos',m); }
    await cargarTodo(); filtro=''; render(); closeModal();
    toast('Restauración completada con éxito ✔');
  }catch(e){
    alert('No se pudo leer el archivo. Asegúrate de que sea un respaldo válido .json.');
  }
}

async function exportarExcel(conTelefono){
  if(!CLIENTES.length){ toast('No hay datos para exportar'); return; }
  const R = resumenDatos();
  let csv = '\ufeffCliente;Telefono;Saldo Actual;Total Fiado;Total Abonado;Dias;Estado\n';
  R.filas.forEach(x => {
    csv += `"${x.c.nombre}";"${x.c.telefono||''}";${x.saldo};${x.fiado};${x.abono};${x.dias};"${x.saldo>0.5?'Debe':'Al día'}"\n`;
  });
  const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
  await compartirODescargar(blob, 'Libreta-Fiados-'+nowCO().toLocaleDateString('en-CA')+'.csv', 'Respaldo de Clientes');
}

async function exportarCSV(conTelefono){
  exportarExcel(conTelefono);
}

async function compartirODescargar(blob, filename, titulo){
  try{
    const file = new File([blob], filename, {type: blob.type});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:titulo, text:titulo});
      toast('Archivo compartido ✔'); return;
    }
  }catch(e){}
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  toast('Archivo descargado ✔');
}

async function borrarTodo(){

  await clearStore('clientes'); await clearStore('movimientos');

}

function tickClock(){

}
